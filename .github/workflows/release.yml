name: Release DTM Inventory

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.3.2)'
        required: true
        default: 'v1.3.2'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install

      - name: Build desktop apps
        run: pnpm master:app

      - name: Install WiX
        run: |
          dotnet tool install --global wix
          wix --version

      - name: Build MSI
        run: pnpm master:msi
        continue-on-error: true

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          $paths = @(
            'artifacts/master-server/dist/downloads',
            'artifacts/master-server/dist/installer'
          )
          foreach ($p in $paths) {
            if (Test-Path $p) {
              Get-ChildItem $p -File | Where-Object { $_.Extension -in '.msi','.apk','.exe','.txt' } | ForEach-Object {
                Copy-Item $_.FullName "release-assets/$($_.Name)" -Force
              }
            }
          }
          Get-ChildItem release-assets | Format-Table Name, Length

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dtm-inventory-installers
          path: release-assets/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: DTM Inventory ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
